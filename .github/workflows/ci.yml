name: Build and Test

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # Bevy's windowing and input crates link these system libraries on
      # Linux; without them the `view` features fail to build, not to test.
      - name: Install Bevy's Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev libasound2-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Every feature at once: a consumer may enable any combination, and the
      # gated modules are most of the crate. winit builds on Linux only with a
      # display backend chosen, which a consumer's app does and a library
      # leaves to it, so CI picks X11 here.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features --features bevy/x11 -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-features --features bevy/x11

      # The view without the capture harness, as a browser renderer takes it:
      # every feature at once would hide a view module that leans on what only
      # `snapshot` brings in.
      - name: View alone, for the browser
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --locked -p arora-visuals --no-default-features --features view,camera_input --target wasm32-unknown-unknown

      # The package a release would upload, built and checked from the
      # packaged sources with every feature, so a file the package leaves out
      # fails here rather than on publish, including one only a gated module
      # reads.
      - name: Package
        run: cargo publish --locked -p arora-visuals --dry-run --all-features --features bevy/x11

  # `@semio/import`: the wasm module built the way a release builds it, then
  # the package's tests run against it, so a change on either side of the
  # wasm interface fails here rather than in a consumer.
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # The CLI must be the version Cargo.lock pins for the wasm-bindgen crate.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build and test the npm package
        working-directory: packages/import
        run: |
          npm ci
          npm run build:wasm
          npm test
