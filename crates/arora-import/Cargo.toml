[package]
name = "arora-import"
version = "0.1.1"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
# Shipped through its npm package (`packages/import`) for now; nothing reads
# the crate from crates.io yet.
publish = false
readme = "README.md"
description = "Optional passes over a GLB at import time, such as choosing triangles that stay unfolded across a mesh's morph targets."

# No Bevy: the passes rewrite a file's bytes before any renderer loads it, so
# this crate stays out of the workspace's Bevy lockstep.
[dependencies]
serde_json = { workspace = true }
thiserror = { workspace = true }
