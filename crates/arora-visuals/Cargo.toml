[package]
name = "arora-visuals"
version = "0.0.0"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "The shared layer above Bevy for Semio assets: asset semantics, data modelling and interaction primitives that every Semio renderer needs."

[features]
default = []
# The headless capture harness. Off by default because it is the only thing
# here that needs a whole Bevy app — `DefaultPlugins`, the render stack, winit
# and a PNG encoder — and a consumer that wants the asset parse should not pay
# for an engine to get it.
snapshot = ["dep:bevy", "dep:image"]
# The parts of a view that need the render stack: knowing when an instance is
# actually drawable, picking over the mesh as drawn, and the selection
# outline. Off by default for the same reason as `snapshot` — a consumer that
# wants the asset parse should not build a renderer to get it.
view = ["dep:bevy"]

# Dependencies are added by the module that needs them, never ahead of one. A
# module that needs no Bevy type must not import one: that is what keeps it out
# of the version lockstep the workspace manifest describes, and `tone` is the
# standing proof that the rule is satisfiable.
[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

# Bevy by sub-crate, never the facade. Naming the sub-crate is what guarantees
# these are the *same* types a consumer's Bevy uses — they are the crates
# `bevy::asset`, `bevy::ecs` and so on re-export, so there is no second copy in
# the tree to unify against — and it keeps the rest of the engine out of a
# build that only wants the parse.
#
# `meta` takes the vector and matrix types; `target` takes an image handle;
# `hold` takes the `Resource` derive. `tone` and `value` take nothing.
bevy_asset = { workspace = true }
bevy_ecs = { workspace = true }
bevy_image = { workspace = true }
bevy_math = { workspace = true }

# `snapshot` only.
bevy = { workspace = true, optional = true, features = [
  "default_app",
  "std",
  "async_executor",
  "multi_threaded",
  "bevy_asset",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_camera",
  "bevy_image",
  "bevy_window",
  "bevy_winit",
  # `view`: the morph-aware pick casts over morphed positions and needs the
  # material pipeline cache to know what has compiled; the outline draws line
  # gizmos, which is the portable answer where WebGL2 has no wireframe.
  "bevy_pbr",
  "bevy_mesh",
  "bevy_scene",
  "morph",
  "bevy_picking",
  "mesh_picking",
  "bevy_gizmos",
  "bevy_gizmos_render",
] }
image = { workspace = true, optional = true }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
